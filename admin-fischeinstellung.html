<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fischregeln verwalten - ASV Langschede</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
       :root {
    --primary-color: #6c3483; /* Tausche diesen Code gegen deinen exakten Wunsch-Ton aus */
    --secondary-color: #884ea0;
    --bg-color: #f4f7f5;
    --text-color: #333;
}
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background-color: #7f8c8d; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 20px; }
        
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary-color); color: white; font-size: 13px; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        input[type="text"], input[type="number"] { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; text-align: center; }
        
        .save-container { margin-top: 20px; text-align: center; }
        .save-btn { background-color: #27ae60; color: white; border: none; padding: 14px 25px; font-size: 17px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .save-btn:hover { background-color: #219653; }
        
        .loading-text { text-align: center; padding: 20px; font-style: italic; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="admin-einstellungen.html" class="btn-back">↩ Zurück zu Einstellungen</a>
    </div>

    <h2>🐟 Fischarten, Mindestmaße & Fenster</h2>

    <div id="loading" class="loading-text">Lade Regeln aus der Datenbank...</div>

    <div class="table-responsive" id="tabelle-wrapper" style="display: none;">
        <table id="regeln-tabelle">
            <thead>
                <tr>
                    <th>Fischart</th>
                    <th>Mindestmaß (cm)</th>
                    <th>Maximalmaß / Fenster (cm)</th>
                    <th>Schonzeit Von</th>
                    <th>Schonzeit Bis</th>
                </tr>
            </thead>
            <tbody id="regeln-tbody">
                <!-- Wird per JavaScript befüllt -->
            </tbody>
        </table>
        
        <div class="save-container">
            <button class="save-btn" onclick="speichereAlleRegeln()">💾 Änderungen in Datenbank speichern</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://eadleysrezkhxxbhqbdx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Y0g8anBpKs3bsC85iado6w_rYske-SZ";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let geladeneRegelnCache = [];

    window.addEventListener('load', function() {
        ladeFischRegeln();
    });

    async function ladeFischRegeln() {
        const loadingDiv = document.getElementById('loading');
        const tabelleWrapper = document.getElementById('tabelle-wrapper');
        const tbody = document.getElementById('regeln-tbody');

        loadingDiv.style.display = 'block';
        tabelleWrapper.style.display = 'none';

        try {
            const { data, error } = await _supabase
                .from('fischarten_regeln')
                .select('*')
                .order('fischart', { ascending: true });

            if (error) throw error;

            geladeneRegelnCache = data || [];
            tbody.innerHTML = '';

            geladeneRegelnCache.forEach((regel, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; color: #5b2c6f;">${regel.fischart}</td>
                    <td><input type="number" id="min-${index}" value="${regel.mindestmass_cm || 0}" min="0" max="300"></td>
                    <td><input type="number" id="max-${index}" value="${regel.maximalmass_cm || 0}" min="0" max="300"></td>
                    <td><input type="text" id="von-${index}" value="${regel.schonzeit_von || ''}" placeholder="09-20"></td>
                    <td><input type="text" id="bis-${index}" value="${regel.schonzeit_bis || ''}" placeholder="02-15"></td>
                `;
                tbody.appendChild(tr);
            });

            loadingDiv.style.display = 'none';
            tabelleWrapper.style.display = 'block';

        } catch (err) {
            loadingDiv.style.display = 'none';
            alert("⚠️ Fehler beim Laden der Regeln: " + err.message);
        }
    }

    async function speichereAlleRegeln() {
        if (!confirm("Möchtest du die geänderten Maße und Schonzeiten für den gesamten Verein speichern?")) return;

        try {
            for (let i = 0; i < geladeneRegelnCache.length; i++) {
                const regel = geladeneRegelnCache[i];
                const neuesMindest = parseFloat(document.getElementById(`min-${i}`).value) || 0;
                const neuesMaximal = parseFloat(document.getElementById(`max-${i}`).value) || 0;
                const neueVon = document.getElementById(`von-${i}`).value.trim() || null;
                const neueBis = document.getElementById(`bis-${i}`).value.trim() || null;

                const { error } = await _supabase
                    .from('fischarten_regeln')
                    .update({
                        mindestmass_cm: neuesMindest,
                        maximalmass_cm: neuesMaximal,
                        schonzeit_von: neueVon,
                        schonzeit_bis: neueBis
                    })
                    .eq('id', regel.id);

                if (error) throw error;
            }

            alert("✅ Alle Fisch-Regeln wurden erfolgreich in der Datenbank aktualisiert!");
            ladeFischRegeln();

        } catch (err) {
            alert("⚠️ Fehler beim Speichern: " + err.message);
        }
    }
</script>

</body>
</html>
