<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASV Admin - Mitgliederverwaltung</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        h2, h3 { color: #8e44ad; text-align: center; margin-top: 0; }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            background-color: #8e44ad;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-zurueck { background-color: #757575; }
        .btn-sm { width: auto; padding: 8px 14px; font-size: 14px; display: inline-block; font-weight: bold; }
        
        input[type="text"], input[type="email"], input[type="tel"], select {
            width: 100%;
            padding: 10px;
            margin: 4px 0 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .search-input {
            border: 2px solid #8e44ad !important;
            background-color: #fcf8ff;
        }
        .card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .mitglieder-tabelle {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .mitglieder-tabelle th, .mitglieder-tabelle td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        .mitglieder-tabelle th { background-color: #f2f2f2; color: #333; }
        .badge-admin {
            background-color: #8e44ad;
            color: white;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-gruppe {
            background-color: #27ae60;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 5px;
        }
        .form-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .treffer-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            text-align: right;
        }
        .info-label {
            font-weight: bold;
            color: #555;
            font-size: 12px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>👥 Mitgliederverwaltung</h2>

        <!-- Zurück-Button ganz oben -->
        <button class="btn btn-zurueck" style="margin-bottom: 15px;" onclick="location.href='admin.html'">⬅️ Zurück zum Admin-Menü</button>

        <!-- Button zum Aufklappen des Anlege-Formulars -->
        <button class="btn" style="background-color: #9b59b6; margin-bottom: 15px;" onclick="toggleAnlegenFormular()">➕ Neues Mitglied anlegen</button>

        <!-- Aufklappbares Formular -->
        <div class="card" id="anlegen-formular" style="display: none; border: 2px solid #8e44ad;">
            <h3>➕ Neues Mitglied anlegen</h3>
            <div class="grid-2">
                <input type="text" id="neu-vorname" placeholder="Vorname">
                <input type="text" id="neu-nachname" placeholder="Nachname">
            </div>
            <input type="email" id="neu-email" placeholder="E-Mail Adresse">
            <input type="tel" id="neu-telefon" placeholder="Telefonnummer / Mobil">
            
            <span class="info-label">Gruppe:</span>
            <select id="neu-gruppe">
                <option value="Erwachsene">Erwachsene</option>
                <option value="Jugendgruppe">Jugendgruppe</option>
            </select>

            <div class="form-row">
                <input type="checkbox" id="neu-admin">
                <label for="neu-admin">Als Vorstand/Admin festlegen</label>
            </div>
            <button class="btn" onclick="mitgliedAnlegen()">Mitglied jetzt speichern</button>
        </div>

        <!-- Mitgliederliste mit Live-Suche -->
        <div class="card">
            <h3>📋 Mitgliederliste</h3>
            
            <input type="text" id="suchfeld" class="search-input" placeholder="🔍 Name, E-Mail, Tel oder Ort..." oninput="tabelleZeichnen()">
            <div class="treffer-info" id="treffer-anzeige">Lade Mitglieder...</div>

            <div style="overflow-x: auto;">
                <table class="mitglieder-tabelle">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Kontakt</th>
                            <th>Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="mitglieder-liste-body">
                        <tr><td colspan="3">Lade Mitglieder...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://eadleysrezkhxxbhqbdx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Y0g8anBpKs3bsC85iado6w_rYske-SZ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let alleMitglieder = [];

        window.onload = function() {
            mitgliederLaden();
        };

        function toggleAnlegenFormular() {
            const form = document.getElementById('anlegen-formular');
            form.style.display = (form.style.display === 'none') ? 'block' : 'none';
        }

        async function mitgliederLaden() {
            const tbody = document.getElementById('mitglieder-liste-body');
            tbody.innerHTML = '<tr><td colspan="3">Lade Mitglieder...</td></tr>';

            const { data, error } = await _supabase
                .from('mitglieder')
                .select('*')
                .order('nachname', { ascending: true });

            if (error) {
                alert("Fehler beim Laden der Mitglieder: " + error.message);
                return;
            }

            alleMitglieder = data || [];
            tabelleZeichnen();
        }

        function tabelleZeichnen() {
            const tbody = document.getElementById('mitglieder-liste-body');
            const suchbegriff = document.getElementById('suchfeld').value.trim().toLowerCase();
            const trefferAnzeige = document.getElementById('treffer-anzeige');

            tbody.innerHTML = '';

            const gefiltert = alleMitglieder.filter(m => {
                const vorname = (m.vorname || '').toLowerCase();
                const nachname = (m.nachname || '').toLowerCase();
                const email = (m.email || '').toLowerCase();
                const telefon = (m.telefon || '').toLowerCase();
                const ort = (m.ort || '').toLowerCase();

                return vorname.includes(suchbegriff) || 
                       nachname.includes(suchbegriff) || 
                       email.includes(suchbegriff) ||
                       telefon.includes(suchbegriff) ||
                       ort.includes(suchbegriff);
            });

            if (suchbegriff === '') {
                trefferAnzeige.textContent = `Gesamt: ${alleMitglieder.length} Mitglieder`;
            } else {
                trefferAnzeige.textContent = `Gefunden: ${gefiltert.length} von ${alleMitglieder.length} Mitgliedern`;
            }

            if (gefiltert.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">Keine passenden Mitglieder gefunden.</td></tr>';
                return;
            }

            gefiltert.forEach(m => {
                const tr = document.createElement('tr');
                const adminTag = m.admin ? '<span class="badge-admin">Admin</span> ' : '';
                const gruppeTag = m.gruppe ? `<span class="badge-gruppe">${m.gruppe}</span>` : '';
                const telInfo = m.telefon ? `<br><small style="color:#555;">📞 ${m.telefon}</small>` : '';

                tr.innerHTML = `
                    <td><b>${m.nachname || ''}</b>, ${m.vorname || ''}<br>${adminTag}${gruppeTag}</td>
                    <td><small>${m.email || ''}</small>${telInfo}</td>
                    <td>
                        <button class="btn btn-sm" onclick="location.href='admin-mitglied-edit.html?id=${m.id}'">✏️ Edit</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function mitgliedAnlegen() {
            const vorname = document.getElementById('neu-vorname').value.trim();
            const nachname = document.getElementById('neu-nachname').value.trim();
            const email = document.getElementById('neu-email').value.trim().toLowerCase();
            const telefon = document.getElementById('neu-telefon').value.trim();
            const gruppe = document.getElementById('neu-gruppe').value;
            const isAdmin = document.getElementById('neu-admin').checked;

            if (!vorname || !nachname || !email) {
                alert("Bitte Vorname, Nachname und E-Mail ausfüllen.");
                return;
            }

            const neueKennung = String(Date.now()).slice(-8);

            const { error } = await _supabase
                .from('mitglieder')
                .insert([{
                    vorname: vorname,
                    nachname: nachname,
                    email: email,
                    telefon: telefon,
                    gruppe: gruppe,
                    admin: isAdmin,
                    kennung: neueKennung
                }]);

            if (error) {
                alert("Fehler beim Anlegen: " + error.message);
            } else {
                alert("Mitglied erfolgreich angelegt!");
                document.getElementById('neu-vorname').value = '';
                document.getElementById('neu-nachname').value = '';
                document.getElementById('neu-email').value = '';
                document.getElementById('neu-telefon').value = '';
                document.getElementById('neu-admin').checked = false;
                toggleAnlegenFormular();
                mitgliederLaden();
            }
        }
    </script>
</body>
</html>
