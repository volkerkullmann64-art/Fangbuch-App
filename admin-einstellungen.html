<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin-Einstellungen - ASV Langschede</title>
    <style>
        :root {
            --primary-color: #2e5a44;
            --secondary-color: #4a7c59;
            --bg-color: #f4f7f5;
            --text-color: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background-color: #7f8c8d; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        h2 { color: var(--primary-color); text-align: center; margin-bottom: 20px; }
        
        /* Das Menü für die verschiedenen Einstellungs-Bereiche */
        .einstellungs-menu { display: flex; flex-direction: column; gap: 15px; }
        
        .einstellungs-btn { 
            background-color: white; 
            color: var(--primary-color); 
            border: 2px solid var(--primary-color); 
            padding: 16px 20px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: left; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .einstellungs-btn:hover { 
            background-color: var(--primary-color); 
            color: white; 
        }
        .einstellungs-btn span { font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="admin.html" class="btn-back">↩ Zurück zum Admin-Bereich</a>
    </div>

    <h2>⚙️ Admin-Einstellungen</h2>

    <!-- Die Auswahlbuttons für die einzelnen Einstellungs-Kategorien -->
    <div class="einstellungs-menu">
        <button class="einstellungs-btn" onclick="location.href='admin_fische.html'">
            <div>
                🐟 Fischarten & Maße
                <div style="font-size: 12px; font-weight: normal; color: #666; margin-top: 3px;">Mindestmaße, Entnahmefenster & Schonzeiten</div>
            </div>
            <span>➔</span>
        </button>

        <!-- Platz für zukünftige Admin-Einstellungs-Buttons -->
    </div>
</div>

</body>
</html>
