<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meine Fangübersicht - ASV Langschede</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --primary-color: #2e7d32;
    --secondary-color: #388e3c;
    --bg-color: #e8f5e9;
    --text-color: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; flex-direction: column; align-items: center; }
.container { width: 100%; max-width: 500px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.btn-back { background-color: #2e7d32; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; }
.btn-back:hover { background-color: #388e3c; }
.btn-edit { background-color: #2e7d32; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }

h2 { color: #2e7d32; text-align: center; margin-bottom: 15px; font-size: 20px; }

/* Statistik-Zähler Boxen oben */
.statistik-grid { display: flex; gap: 8px; margin-bottom: 15px; }
.statistik-card { flex: 1; background: #f4f8f5; border: 1px solid #d0e1d4; padding: 10px 5px; border-radius: 8px; text-align: center; }
.statistik-card .zahl { display: block; font-size: 18px; font-weight: bold; color: #2e7d32; margin-top: 2px; }
.statistik-card .label { font-size: 11px; color: #666; text-transform: uppercase; font-weight: bold; }

.fang-tabelle { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 14px; }
.fang-tabelle th { background-color: #2e7d32; color: white; text-align: left; padding: 10px 6px; font-size: 13px; }
.fang-tabelle td { padding: 10px 6px; border-bottom: 1px solid #eee; color: #333; }
.fang-tabelle tr:nth-child(even) { background-color: #fdfdfd; }
.details-row td p { margin: 3px 0; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="btn-back" onclick="location.href='index.html'">↩ Zurück zum Hauptmenü</button>
        <button id="edit-toggle-btn" class="btn-edit" onclick="toggleEditMode()">✏️ Bearbeiten</button>
    </div>

    <h2>📊 Meine Fangübersicht</h2>

    <!-- NEU: Kleine Zähler-Boxen oben -->
    <div id="statistik-container" class="statistik-grid" style="display: none;">
        <div class="statistik-card">
            <span class="label">Angeltage</span>
            <span id="stat-gesamt" class="zahl">0</span>
        </div>
        <div class="statistik-card">
            <span class="label">Erfolgreich</span>
            <span id="stat-erfolgreich" class="zahl" style="color: #2e7d32;">0</span>
        </div>
        <div class="statistik-card">
            <span class="label">Schneider</span>
            <span id="stat-schneider" class="zahl" style="color: #c0392b;">0</span>
        </div>
    </div>

    <div id="faenge-tabelle-container">
        <div style="text-align: center; padding: 20px; color: #666;">⏳ Lade Einträge...</div>
    </div>
</div>

<script src="auswertung.js"></script>
</body>
</html>
