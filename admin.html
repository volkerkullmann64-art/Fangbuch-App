<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASV Admin - Hauptmenü</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 { color: #8e44ad; margin-top: 0; margin-bottom: 25px; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            background-color: #8e44ad;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-zurueck { background-color: #757575; margin-top: 30px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚙️ Vorstand / Admin</h2>

        <button class="btn" onclick="location.href='admin-mitglieder.html'">👥 Mitgliederverwaltung</button>

        <button class="btn btn-zurueck" onclick="location.href='index.html'">⬅️ Hauptmenü</button>
    </div>

</body>
</html>
