<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fangauswertung - ASV Langschede</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --primary-color: #2e5a44;
    --secondary-color: #4a7c59;
    --bg-color: #f4f7f5;
    --text-color: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; display: flex; flex-direction: column; align-items: center; }
.container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
.btn-back { background-color: var(--primary-color); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; }
.btn-back:hover { background-color: var(--secondary-color); }
h2 { color: var(--primary-color); text-align: center; margin-bottom: 15px; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="btn-back" onclick="location.href='index.html'">↩ Zurück zum Hauptmenü</button>
    </div>

    <h2>📊 Fangübersicht / Auswertung</h2>

    <div id="faenge-liste">
        <div style="text-align: center; padding: 30px; color: #666;">⏳ Lade Fänge...</div>
    </div>
</div>

<script src="auswertung.js"></script>
</body>
</html>
